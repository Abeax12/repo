# mod_md Configuration for ACME Certificate Management (Enterprise-oriented baseline)
#
# Notes:
# - This file sets sensible global defaults; define domains separately via one or more
#   `MDomain ...` blocks (or inside virtual hosts) as needed.
# - Keep your CA URL/terms as provided; adjust optional items (proxy, key sizes, notify hooks)
#   to match your environment and compliance requirements.
#

# -----------------------------
# CA + account configuration
# -----------------------------
# Contact email for ACME notifications (expiry, problems, etc.)
MDContactEmail internet@com.com

# Your enterprise/private ACME directory endpoint
MDCertificateAuthority https://acme.pki.net.com/pgwy/acme/directory

# Required by most ACME CAs
MDCertificateAgreement accepted

# Challenge type(s)
# - http-01 requires port 80 reachable for the managed domains.
# - tls-alpn-01 requires port 443 reachable and Apache to answer the ALPN challenge.
# Keep http-01 if that's what your environment supports; you can add tls-alpn-01 as fallback.
MDCAChallenges http-01
#MDCAChallenges http-01 tls-alpn-01


# -----------------------------
# Storage + automation behavior
# -----------------------------
# Where mod_md stores accounts, certificates, and private keys.
# Ensure this is readable by Apache and protected with correct filesystem permissions.
MDStoreDir /var/lib/apache2/md

# Drive mode:
# - auto: mod_md automatically obtains/renews certs when `MDomain` is configured.
# - manual: admin triggers actions (useful for tightly controlled change windows).
MDDriveMode auto

# Optional: prevent immediate activation after obtaining/renewing a cert.
# Useful in controlled environments to allow config reload orchestration.
#MDActivationDelay 5m


# -----------------------------
# Keys / crypto posture
# -----------------------------
# Enterprise defaults often prefer ECDSA (smaller, faster) plus RSA for legacy clients.
# If your compliance requires a specific type/size, pin accordingly.
#
# Common hardening choices:
# - RSA 3072 (stronger than 2048, more CPU)
# - ECDSA P-256 (widely supported) or P-384 (stronger, slightly less ubiquitous)
#
# Depending on your mod_md version, `MDPrivateKeys` accepts one or multiple key specs.
# If your deployment cannot handle multiple keys, choose one line and comment the other.
MDPrivateKeys RSA 3072
#MDPrivateKeys secp256r1
#MDPrivateKeys RSA 3072 secp256r1


# -----------------------------
# Renewal policy (operations)
# -----------------------------
# Renew window: when to start renewal attempts before expiry.
# Default is 33% of lifetime; an explicit window is often preferred for predictability.
MDRenewWindow 30d

# Optional: adjust retry behavior if ACME is temporarily unavailable.
# This is particularly useful behind corporate proxies or during CA incidents.
#MDRetryDelay 1h

# Optional: in high-change environments, you can force more aggressive renewals.
# Use with caution; can increase CA rate-limit risk.
#MDRenewMode auto


# -----------------------------
# HTTPS enforcement / behavior
# -----------------------------
# Redirect HTTP to HTTPS for managed domains.
# This reduces accidental plaintext exposure.
MDRequireHttps permanent


# -----------------------------
# OCSP stapling (performance + privacy)
# -----------------------------
# Enable OCSP stapling for managed domains (recommended when your TLS config supports it).
MDStapling on

# Optional: staple intermediate cert status as well (if supported by your build/version).
#MDStapleOthers on


# -----------------------------
# Enterprise network constraints
# -----------------------------
# If Apache needs an outbound proxy to reach the ACME CA:
#MDHttpProxy http://proxy.example.com:3128
#MDHttpProxy https://proxy.example.com:3128
#
# If your environment pins trusted roots, ensure the CA chain is trusted by the OS.


# -----------------------------
# Change management hooks
# -----------------------------
# Run a command after new certificates are obtained/renewed.
# Use this for reload orchestration, monitoring, ticketing, etc.
#
# NOTE: Keep scripts idempotent and non-interactive.
#MDNotifyCmd "/usr/local/sbin/md-notify.sh %d %s"
#
# Example (script responsibilities):
# - validate cert/key presence
# - reload Apache (`apachectl graceful`)
# - send event to SIEM/monitoring
# - emit structured logs

