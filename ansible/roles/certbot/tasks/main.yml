---
- name: Install certbot (Debian/Ubuntu)
  ansible.builtin.apt:
    name:
      - certbot
    update_cache: true
    state: present
  when: ansible_facts.os_family == 'Debian'

- name: Ensure Let's Encrypt directories exist
  ansible.builtin.file:
    path: /etc/letsencrypt
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Build certbot domain args
  ansible.builtin.set_fact:
    _certbot_domain_args: "{{ tls_domains | map('regex_replace', '^(.*)$', '-d \\1') | join(' ') }}"

- name: Build certbot extra args
  ansible.builtin.set_fact:
    _certbot_extra_args: "{{ certbot_extra_args | default([]) | map('quote') | join(' ') }}"

- name: Obtain/renew certificate (webroot)
  ansible.builtin.command: >-
    certbot certonly --non-interactive --agree-tos
    -m {{ certbot_email | quote }}
    --webroot -w {{ certbot_webroot_path | quote }}
    {{ _certbot_domain_args }}
    {{ _certbot_extra_args }}
  register: _certbot_result_webroot
  changed_when: >-
    (_certbot_result_webroot.rc == 0) and
    (
      'Congratulations!' in (_certbot_result_webroot.stdout | default('')) or
      'successfully received certificate' in (_certbot_result_webroot.stdout | default('')) or
      'Certificate not yet due for renewal' not in (_certbot_result_webroot.stdout | default(''))
    )
  when: certbot_method == 'webroot'

- name: Obtain/renew certificate (standalone)
  ansible.builtin.command: >-
    certbot certonly --non-interactive --agree-tos
    -m {{ certbot_email | quote }}
    --standalone
    {{ _certbot_domain_args }}
    {{ _certbot_extra_args }}
  register: _certbot_result_standalone
  changed_when: >-
    (_certbot_result_standalone.rc == 0) and
    (
      'Congratulations!' in (_certbot_result_standalone.stdout | default('')) or
      'successfully received certificate' in (_certbot_result_standalone.stdout | default('')) or
      'Certificate not yet due for renewal' not in (_certbot_result_standalone.stdout | default(''))
    )
  when: certbot_method == 'standalone'
